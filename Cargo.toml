[package]
name = "u502_bot"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "u502"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "metrics",
    "panic",
    "tracing",
    "ureq",
    "rustls",
] }
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
