services:
  bot:
    build: .
    image: ghcr.io/umonkey/u502_bot:latest
    restart: unless-stopped
    # The bot stops polling, stores what it already received, closes the database, and flushes
    # Sentry before exiting; 20s leaves room for that without delaying a restart much.
    stop_grace_period: 20s
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      TELEGRAM_API_TOKEN_FILE: /run/secrets/telegram_api_token
      SENTRY_DSN_FILE: /run/secrets/sentry_dsn
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      # Empty means "use the built-in default"; a host or .env value still overrides it.
      TRANSCRIBE_MODEL_NAME: ${TRANSCRIBE_MODEL_NAME:-}
      # Required: the Telegram user id of the bot's owner, e.g. 123456789.
      OWNER_USER_ID: ${OWNER_USER_ID:-}
      # Optional: unset keeps the built-in 30 days, 0 keeps every row.
      RETENTION_DAYS: ${RETENTION_DAYS:-}
      DATABASE_PATH: /opt/data/database.sqlite
    volumes:
      - u502_data:/opt/data
    secrets:
      - telegram_api_token
      - sentry_dsn
      - openrouter_api_key

volumes:
  u502_data:

secrets:
  telegram_api_token:
    file: .secrets/telegram_api_token
  sentry_dsn:
    file: .secrets/sentry_dsn
  openrouter_api_key:
    file: .secrets/openrouter_api_key
